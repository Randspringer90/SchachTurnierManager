<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Lokaler Schach-Turniermanager fuer Vereine, Turnierleiter und mobile Ergebnisansichten." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/stm-icon.svg" />

    <title>SchachTurnierManager</title>

    <div id="root"></div>

      <p id="stm-startup-message" role="status" aria-live="polite" aria-atomic="true">Falls diese Ansicht stehen bleibt, pr&uuml;fe die Verbindung zum Turnierrechner. Du kannst die Startseite erneut &ouml;ffnen.</p>
      <p><a href="/">Startseite erneut &ouml;ffnen</a></p>

    <script type="module" src="/src/main.tsx"></script>
